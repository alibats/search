<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>PS3 Simple Search</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div id="container">
    <div id="logo">Bats Search</div>
    <form id="searchForm" onsubmit="return doSearch();">
      <div id="searchBox">
        <input type="text" name="q" id="q" size="50" placeholder="Search the web">
      </div>
      <div id="buttons">
        <input type="submit" value="Search">
        <input type="button" value="I'm Feeling Lucky" onclick="luckySearch();">
      </div>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
