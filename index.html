<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PS3 Search Engine</title>

<style>
body {
    background-color: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
}

h1 {
    margin-top: 20px;
    font-size: 22px;
}

.search-box {
    margin-top: 20px;
}

input {
    width: 80%;
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    font-size: 16px;
    cursor: pointer;
}

#results {
    margin-top: 20px;
    text-align: left;
    padding: 10px;
}

.result {
    background: #222;
    padding: 10px;
    margin-bottom: 10px;
    border-left: 3px solid #4af;
}

.result a {
    color: #4af;
    text-decoration: none;
}
</style>
</head>

<body>

<h1>PS3 Search Engine</h1>

<div class="search-box">
    <input type="text" id="query" placeholder="Search something...">
    <br>
    <button onclick="doSearch()">Search</button>
</div>

<div id="results"></div>

<script>
function doSearch() {
    var query = document.getElementById("query").value;

    if (!query) {
        document.getElementById("results").innerHTML = "<p>Please enter a search term.</p>";
        return;
    }

    var url = "https://api.duckduckgo.com/?q=" 
              + encodeURIComponent(query) 
              + "&format=json&no_redirect=1&no_html=1";

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {

                var data = JSON.parse(xhr.responseText);
                var html = "";

                // Abstract result (top answer)
                if (data.AbstractText) {
                    html += "<div class='result'>";
                    html += "<b>Answer:</b><br>" + data.AbstractText + "<br>";
                    if (data.AbstractURL) {
                        html += "<a href='" + data.AbstractURL + "' target='_blank'>Read more</a>";
                    }
                    html += "</div>";
                }

                // Related topics
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    for (var i = 0; i < data.RelatedTopics.length; i++) {
                        var item = data.RelatedTopics[i];

                        if (item.Text) {
                            html += "<div class='result'>";
                            html += item.Text + "<br>";
                            if (item.FirstURL) {
                                html += "<a href='" + item.FirstURL + "' target='_blank'>Open link</a>";
                            }
                            html += "</div>";
                        }
                    }
                }

                if (html === "") {
                    html = "<p>No results found.</p>";
                }

                document.getElementById("results").innerHTML = html;

            } else {
                document.getElementById("results").innerHTML =
                    "<p>Error loading results. Check internet connection.</p>";
            }
        }
    };

    xhr.send();
}
</script>

</body>
</html>
